<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Hayden Keys — Learn Piano, Gamified</title>
<meta name="description" content="A free, gamified, Duolingo-style piano learning web app. 100% local, zero backend, runs entirely in your browser." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icons/icon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<meta name="theme-color" content="#fdf6fa" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Hayden Keys" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hk-header">
    <img src="assets/mascot-square.png" alt="Hayden Keys mascot — a hand-drawn panda playing an upright piano" class="hk-logo" />
    <h1>Hayden Keys</h1>
    <p class="hk-tagline">Learn any song in piano for free!</p>
    <div class="hk-level-chip" id="hk-level-chip"></div>
  </header>

  <nav class="hk-tabs">
    <button class="hk-tab hk-tab-active" data-tab="lessons">Lessons</button>
    <button class="hk-tab" data-tab="roadmap">Roadmap</button>
    <button class="hk-tab" data-tab="discover">Discover</button>
    <button class="hk-tab" data-tab="practice">Practice</button>
    <button class="hk-tab" data-tab="saved">Saved</button>
    <button class="hk-tab" data-tab="how">How It Works</button>
    <button class="hk-tab" data-tab="midi">MIDI</button>
  </nav>

  <main>
    <section id="panel-lessons" class="hk-panel"></section>
    <section id="panel-roadmap" class="hk-panel hk-hidden"></section>
    <section id="panel-discover" class="hk-panel hk-hidden"></section>
    <section id="panel-practice" class="hk-panel hk-hidden"></section>
    <section id="panel-saved" class="hk-panel hk-hidden"></section>
    <section id="panel-how" class="hk-panel hk-hidden"></section>
    <section id="panel-about" class="hk-panel hk-hidden"></section>
    <section id="panel-midi" class="hk-panel hk-hidden"></section>
  </main>

  <footer class="hk-footer">
    <p>Hayden Keys runs 100% in your browser. No account, no server, no cost.
       <button class="hk-footer-link" data-tab="about">About &amp; Credits</button> ·
       <a href="privacy.html">Privacy Policy</a> ·
       <!-- Item 56: README/notices point at GitHub's rendered copies instead of the raw .md
            files -- the .md files aren't bundled into the iOS app (only www/ is), and raw
            markdown in the app's WebView was a dead end with no way back. -->
       <a href="https://github.com/Astryks/haydenkeys/blob/main/README.md" target="_blank" rel="noopener">README</a> · <a href="https://github.com/Astryks/haydenkeys/blob/main/THIRD_PARTY_NOTICES.md" target="_blank" rel="noopener">THIRD_PARTY_NOTICES</a><span class="hk-web-only"> ·
       <!-- Item 43: placeholder until Sid creates the real Stripe Payment Link -- paste it
            into STRIPE_PAYMENT_LINK at the top of js/app.js (nothing to change here).
            Item 56: hidden inside the native iOS app (.hk-web-only)
            -- an external payment link for tips/donations in an App Store app runs into
            App Review guideline 3.1.1; the web version keeps it. -->
       <a href="#" id="hk-support-link" data-stripe-link-pending="true" class="hk-support-link">Support Hayden Keys</a></span>.</p>
  </footer>

  <!-- Portrait phones only (CSS): a dismissible tip, never a block. -->
  <button type="button" class="hk-rotate-tip" onclick="this.remove()" aria-label="Dismiss tip">📱 Tip: turn your phone sideways for bigger piano keys. <span aria-hidden="true">✕</span></button>

  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => {
          console.warn("Hayden Keys: service worker registration failed", err);
        });
      });
    }
  </script>
</body>
</html>
