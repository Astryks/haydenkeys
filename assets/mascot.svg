<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6fa" />
      <stop offset="100%" stop-color="#eef7fb" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f0ee" />
    </linearGradient>
    <linearGradient id="keyStickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7d8f0" />
      <stop offset="100%" stop-color="#f4b8d0" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="190" fill="url(#bgGrad)" />

  <!-- legs, sitting cross-legged -->
  <ellipse cx="400" cy="840" rx="110" ry="50" fill="#2a2a32" />
  <ellipse cx="624" cy="840" rx="110" ry="50" fill="#2a2a32" />

  <!-- fat round white body, leaning slightly to hold the stick -->
  <ellipse cx="500" cy="630" rx="225" ry="205" fill="url(#bodyGrad)" />

  <!-- the "bamboo stick" - a vertical strip of piano keys, held upright like real bamboo -->
  <g transform="rotate(-8 700 560)">
    <rect x="672" y="300" width="56" height="520" rx="10" fill="url(#keyStickGrad)" />
    <!-- segment joints, like bamboo nodes, doubling as the piano's black keys -->
    <rect x="672" y="380" width="56" height="16" fill="#2a2a32" />
    <rect x="672" y="470" width="56" height="16" fill="#2a2a32" />
    <rect x="672" y="560" width="56" height="16" fill="#2a2a32" />
    <rect x="672" y="650" width="56" height="16" fill="#2a2a32" />
    <!-- a little music note sprouting off the top, like a bamboo leaf -->
    <circle cx="700" cy="270" r="22" fill="url(#keyStickGrad)" />
    <rect x="716" y="180" width="10" height="100" fill="url(#keyStickGrad)" />
    <path d="M 726 180 C 760 184 772 210 752 232 C 744 216 732 206 718 202 Z" fill="url(#keyStickGrad)" />
  </g>

  <!-- black arms gripping the stick, one high one low like a real bamboo grip -->
  <ellipse cx="640" cy="520" rx="46" ry="64" fill="#2a2a32" transform="rotate(25 640 520)" />
  <ellipse cx="612" cy="700" rx="46" ry="64" fill="#2a2a32" transform="rotate(35 612 700)" />
  <circle cx="676" cy="560" r="32" fill="#2a2a32" />
  <circle cx="648" cy="740" r="32" fill="#2a2a32" />

  <!-- head, tilted slightly toward the stick, mid-nibble -->
  <ellipse cx="470" cy="410" rx="195" ry="175" fill="url(#bodyGrad)" />

  <!-- ears -->
  <circle cx="340" cy="268" r="62" fill="#2a2a32" />
  <circle cx="606" cy="262" r="62" fill="#2a2a32" />

  <!-- panda eye patches -->
  <ellipse cx="398" cy="415" rx="58" ry="70" fill="#2a2a32" transform="rotate(-12 398 415)" />
  <ellipse cx="546" cy="412" rx="58" ry="70" fill="#2a2a32" transform="rotate(10 546 412)" />

  <!-- eyes, looking happily toward the stick -->
  <circle cx="412" cy="418" r="26" fill="#ffffff" />
  <circle cx="538" cy="416" r="26" fill="#ffffff" />
  <circle cx="420" cy="422" r="14" fill="#2a2a32" />
  <circle cx="546" cy="420" r="14" fill="#2a2a32" />
  <circle cx="425" cy="416" r="5" fill="#ffffff" />
  <circle cx="551" cy="414" r="5" fill="#ffffff" />

  <!-- rosy cheeks -->
  <circle cx="372" cy="470" r="24" fill="#f6b8c6" opacity="0.7" />
  <circle cx="576" cy="468" r="24" fill="#f6b8c6" opacity="0.7" />

  <!-- nose + open happy mouth, mid-bite on the "bamboo" -->
  <ellipse cx="478" cy="462" rx="26" ry="18" fill="#2a2a32" />
  <path d="M 478 480 L 478 494" stroke="#2a2a32" stroke-width="6" stroke-linecap="round" />
  <path d="M 450 500 Q 478 530 512 500 Q 500 518 478 518 Q 456 518 450 500 Z" fill="#2a2a32" />
</svg>
