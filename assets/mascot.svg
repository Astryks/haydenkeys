<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6fa" />
      <stop offset="100%" stop-color="#eef7fb" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f0ee" />
    </linearGradient>
    <linearGradient id="pianoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7d8f0" />
      <stop offset="100%" stop-color="#f4b8d0" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="190" fill="url(#bgGrad)" />

  <!-- legs -->
  <path d="M 390 720 Q 370 800 405 850 L 475 850 Q 465 770 465 710 Z" fill="#2a2a32" />
  <path d="M 650 720 Q 670 800 635 850 L 565 850 Q 575 770 575 710 Z" fill="#2a2a32" />
  <ellipse cx="430" cy="858" rx="88" ry="42" fill="#2a2a32" />
  <ellipse cx="610" cy="858" rx="88" ry="42" fill="#2a2a32" />

  <!-- fat round white body -->
  <ellipse cx="512" cy="620" rx="225" ry="205" fill="url(#bodyGrad)" />

  <!-- black arms, paws resting near piano -->
  <ellipse cx="335" cy="660" rx="44" ry="62" fill="#2a2a32" transform="rotate(-18 335 660)" />
  <ellipse cx="689" cy="660" rx="44" ry="62" fill="#2a2a32" transform="rotate(18 689 660)" />
  <circle cx="306" cy="716" r="30" fill="#2a2a32" />
  <circle cx="718" cy="716" r="30" fill="#2a2a32" />

  <!-- head -->
  <ellipse cx="512" cy="400" rx="195" ry="175" fill="url(#bodyGrad)" />

  <!-- ears -->
  <circle cx="378" cy="258" r="62" fill="#2a2a32" />
  <circle cx="646" cy="258" r="62" fill="#2a2a32" />

  <!-- panda eye patches -->
  <ellipse cx="438" cy="405" rx="58" ry="70" fill="#2a2a32" transform="rotate(-12 438 405)" />
  <ellipse cx="586" cy="405" rx="58" ry="70" fill="#2a2a32" transform="rotate(12 586 405)" />

  <!-- eyes -->
  <circle cx="446" cy="408" r="26" fill="#ffffff" />
  <circle cx="578" cy="408" r="26" fill="#ffffff" />
  <circle cx="450" cy="412" r="14" fill="#2a2a32" />
  <circle cx="582" cy="412" r="14" fill="#2a2a32" />
  <circle cx="455" cy="406" r="5" fill="#ffffff" />
  <circle cx="587" cy="406" r="5" fill="#ffffff" />

  <!-- rosy cheeks -->
  <circle cx="410" cy="462" r="24" fill="#f6b8c6" opacity="0.7" />
  <circle cx="614" cy="462" r="24" fill="#f6b8c6" opacity="0.7" />

  <!-- nose + mouth -->
  <ellipse cx="512" cy="455" rx="26" ry="18" fill="#2a2a32" />
  <path d="M 512 473 L 512 490" stroke="#2a2a32" stroke-width="6" stroke-linecap="round" />
  <path d="M 478 505 Q 512 525 546 505" stroke="#2a2a32" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- little piano in front -->
  <g>
    <rect x="300" y="760" width="424" height="110" rx="14" fill="url(#pianoGrad)" />
    <rect x="316" y="774" width="392" height="56" rx="4" fill="#2a2a32" />
    <rect x="320" y="774" width="48" height="56" fill="#fdf6fa" />
    <rect x="372" y="774" width="48" height="56" fill="#fdf6fa" />
    <rect x="424" y="774" width="48" height="56" fill="#fdf6fa" />
    <rect x="476" y="774" width="48" height="56" fill="#fdf6fa" />
    <rect x="528" y="774" width="48" height="56" fill="#fdf6fa" />
    <rect x="580" y="774" width="48" height="56" fill="#fdf6fa" />
    <rect x="632" y="774" width="48" height="56" fill="#fdf6fa" />
    <rect x="356" y="774" width="22" height="34" fill="#2a2a32" />
    <rect x="408" y="774" width="22" height="34" fill="#2a2a32" />
    <rect x="512" y="774" width="22" height="34" fill="#2a2a32" />
    <rect x="564" y="774" width="22" height="34" fill="#2a2a32" />
    <rect x="616" y="774" width="22" height="34" fill="#2a2a32" />
  </g>
</svg>
