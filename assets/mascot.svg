<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6fa" />
      <stop offset="100%" stop-color="#eef7fb" />
    </linearGradient>
    <radialGradient id="bodyGrad" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eceae8" />
    </radialGradient>
    <linearGradient id="keyStickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7d8f0" />
      <stop offset="100%" stop-color="#f4b8d0" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="190" fill="url(#bgGrad)" />

  <!-- fluffy fat legs/feet -->
  <ellipse cx="400" cy="850" rx="120" ry="58" fill="#2f2f38" />
  <ellipse cx="636" cy="850" rx="120" ry="58" fill="#2f2f38" />
  <!-- little fluff tufts on the feet -->
  <circle cx="330" cy="818" r="22" fill="#2f2f38" />
  <circle cx="470" cy="818" r="22" fill="#2f2f38" />
  <circle cx="566" cy="818" r="22" fill="#2f2f38" />
  <circle cx="706" cy="818" r="22" fill="#2f2f38" />

  <!-- extra-round, extra-fat fluffy body -->
  <ellipse cx="500" cy="660" rx="255" ry="225" fill="url(#bodyGrad)" />
  <!-- fluff texture tufts around the body edge -->
  <g fill="#ffffff">
    <circle cx="270" cy="560" r="26" /><circle cx="250" cy="640" r="24" /><circle cx="258" cy="720" r="22" />
    <circle cx="730" cy="560" r="26" /><circle cx="750" cy="640" r="24" /><circle cx="742" cy="720" r="22" />
    <circle cx="340" cy="860" r="20" /><circle cx="660" cy="860" r="20" />
  </g>

  <!-- the "bamboo stick" - vertical piano-key strip -->
  <g transform="rotate(-8 712 560)">
    <rect x="684" y="300" width="56" height="520" rx="10" fill="url(#keyStickGrad)" />
    <rect x="684" y="380" width="56" height="16" fill="#2f2f38" />
    <rect x="684" y="470" width="56" height="16" fill="#2f2f38" />
    <rect x="684" y="560" width="56" height="16" fill="#2f2f38" />
    <rect x="684" y="650" width="56" height="16" fill="#2f2f38" />
    <circle cx="712" cy="270" r="22" fill="url(#keyStickGrad)" />
    <rect x="728" y="180" width="10" height="100" fill="url(#keyStickGrad)" />
    <path d="M 738 180 C 772 184 784 210 764 232 C 756 216 744 206 730 202 Z" fill="url(#keyStickGrad)" />
  </g>

  <!-- fluffy black arms -->
  <ellipse cx="652" cy="540" rx="52" ry="70" fill="#2f2f38" transform="rotate(25 652 540)" />
  <ellipse cx="624" cy="710" rx="52" ry="70" fill="#2f2f38" transform="rotate(35 624 710)" />
  <circle cx="690" cy="580" r="36" fill="#2f2f38" />
  <circle cx="660" cy="748" r="36" fill="#2f2f38" />

  <!-- extra-round, fluffy head -->
  <ellipse cx="460" cy="420" rx="215" ry="195" fill="url(#bodyGrad)" />
  <!-- fluff tufts around the head/cheeks -->
  <g fill="#ffffff">
    <circle cx="268" cy="400" r="22" /><circle cx="252" cy="470" r="20" />
    <circle cx="652" cy="394" r="22" /><circle cx="668" cy="464" r="20" />
  </g>

  <!-- big round fluffy ears -->
  <circle cx="320" cy="270" r="74" fill="#2f2f38" />
  <circle cx="600" cy="262" r="74" fill="#2f2f38" />
  <circle cx="320" cy="270" r="30" fill="#45454f" />
  <circle cx="600" cy="262" r="30" fill="#45454f" />

  <!-- panda eye patches, extra large and round for a softer cute look -->
  <ellipse cx="380" cy="430" rx="68" ry="80" fill="#2f2f38" transform="rotate(-10 380 430)" />
  <ellipse cx="538" cy="426" rx="68" ry="80" fill="#2f2f38" transform="rotate(10 538 426)" />

  <!-- BIG sparkly eyes -->
  <circle cx="392" cy="434" r="36" fill="#ffffff" />
  <circle cx="548" cy="430" r="36" fill="#ffffff" />
  <circle cx="400" cy="440" r="20" fill="#2f2f38" />
  <circle cx="556" cy="436" r="20" fill="#2f2f38" />
  <circle cx="408" cy="430" r="7" fill="#ffffff" />
  <circle cx="564" cy="426" r="7" fill="#ffffff" />
  <circle cx="390" cy="450" r="4" fill="#ffffff" />
  <circle cx="546" cy="446" r="4" fill="#ffffff" />

  <!-- rosy cheeks -->
  <circle cx="352" cy="488" r="26" fill="#f6b8c6" opacity="0.75" />
  <circle cx="566" cy="484" r="26" fill="#f6b8c6" opacity="0.75" />

  <!-- small nose only - no mouth/lips, kept blank per request -->
  <ellipse cx="462" cy="480" rx="24" ry="17" fill="#2f2f38" />
</svg>
