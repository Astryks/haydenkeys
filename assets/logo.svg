<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="keyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7d8f0" />
      <stop offset="100%" stop-color="#f4b8d0" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6fa" />
      <stop offset="100%" stop-color="#eef7fb" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="190" fill="url(#bgGradient)" />

  <!-- Key bow (the round part you hold) - a ring, echoing a piano's roundness -->
  <circle cx="400" cy="340" r="150" fill="none" stroke="url(#keyGradient)" stroke-width="56" />
  <circle cx="400" cy="340" r="54" fill="url(#bgGradient)" />

  <!-- Key shaft -->
  <rect x="372" y="470" width="56" height="300" fill="url(#keyGradient)" />

  <!-- Key teeth, cut in the shape of piano keys (alternating white/black key pattern) -->
  <g>
    <!-- white-key teeth, stepped like real key-cut teeth -->
    <rect x="372" y="770" width="56" height="60" fill="url(#keyGradient)" />
    <rect x="428" y="700" width="56" height="130" fill="url(#keyGradient)" />
    <rect x="484" y="750" width="56" height="80" fill="url(#keyGradient)" />
    <rect x="540" y="690" width="56" height="140" fill="url(#keyGradient)" />
    <!-- black-key teeth notches, cut shorter and inset like real black keys -->
    <rect x="428" y="700" width="30" height="70" fill="#2a2a3a" />
    <rect x="540" y="690" width="30" height="70" fill="#2a2a3a" />
  </g>
</svg>
